<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Seat Map Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h2>Real-time Seat Lock/Release Monitor</h2>
<div>
    <label>Event ID:</label>
    <input type="text" id="eventId" value="YOUR-EVENT-UUID" style="width: 300px;" />
    <button onclick="connect()">Connect & Subscribe</button>
</div>
<ul id="events-log" style="margin-top: 20px; font-family: monospace;"></ul>

<script>
    let stompClient = null;

    function connect() {
        const eventId = document.getElementById('eventId').value;
        const socket = new SockJS('http://localhost:8080/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            log("Đã kết nối WebSocket thành công!");

            // Lắng nghe topic của event này
            stompClient.subscribe('/topic/events/' + eventId + '/seats', function (message) {
                const data = JSON.parse(message.body);
                log(`[NHẬN EVENT] Hành động: ${data.action} | Trạng thái: ${data.status} | Danh sách ghế: ${JSON.stringify(data.seatIds)}`);
            });
        }, function (error) {
            log("Lỗi kết nối: " + error);
        });
    }

    function log(msg) {
        const li = document.createElement('li');
        li.innerText = new Date().toLocaleTimeString() + " - " + msg;
        document.getElementById('events-log').prepend(li);
    }
</script>
</body>
</html>
