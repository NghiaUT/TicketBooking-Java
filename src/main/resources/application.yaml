spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: ticket-booking
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRE_MS}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ticket-booking
    distribution:
      # Bật histogram cho http_server_requests
      percentiles-histogram:
        http:
          server:
            requests: true