spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: ticket-booking
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRE_MS}
